name: Review my games

on:
  push:
    branches: [main]
    paths:
      - "games/**"
      - "config.json"
      - "review.py"
      - "template.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Stockfish and python-chess
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          pip install -r requirements.txt
      - name: Reuse earlier analysis
        uses: actions/cache@v4
        with:
          path: .cache
          key: analysis-${{ github.run_id }}
          restore-keys: analysis-
      - name: Build the report
        run: python review.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
